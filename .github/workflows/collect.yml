name: Tankpreise sammeln

on:
  schedule:
    # 7 Minuten nach jeder vollen Stunde (bewusst keine runde Zeit)
    - cron: "7 * * * *"
  workflow_dispatch: {}  # erlaubt manuellen Start zum Testen

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Preise abfragen
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: python collect_prices.py

      - name: Ergebnis committen
        run: |
          git config user.name "tankpreis-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.csv
          git diff --staged --quiet || git commit -m "Preise: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
